name: maestro_mobile
description: Flutter client for the Maestro Supabase backend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  supabase_flutter: ^2.0.0
  share_plus: ^11.1.0
  file_selector: ^1.1.0
  uuid: ^4.5.3
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/maestro-icon.png
